<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">alpha 螺旋中相隔三或四个残基的侧链相互作用</title><desc id="description">俯视 alpha 螺旋的每残基一百度旋转，说明 i 与 i+3 或 i+4 的侧链在空间上相邻，异号电荷可形成稳定离子对，同号电荷则相互排斥。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }.res { fill: #ffffff; stroke: #64748b; stroke-width: 2; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">每残基旋转约 100°：序列上相隔 3–4 位，空间上却很近</text>
  <line x1="600" y1="105" x2="600" y2="430" stroke="#d8e0eb" stroke-width="2"/>
  <text x="320" y="120" class="label" text-anchor="middle" fill="#16744a">异号电荷：稳定</text><circle cx="320" cy="280" r="132" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="3"/><circle cx="320" cy="280" r="42" fill="#d1fae5" stroke="#16a06a" stroke-width="3"/>
  <g class="res"><circle cx="320" cy="165" r="28"/><circle cx="433" cy="260" r="28"/><circle cx="360" cy="389" r="28"/><circle cx="220" cy="350" r="28"/><circle cx="212" cy="220" r="28"/></g>
  <circle cx="320" cy="165" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="320" y="173" font-size="28" font-weight="800" text-anchor="middle" fill="#b91c1c">+</text><text x="320" y="137" class="note" text-anchor="middle">i</text>
  <circle cx="220" cy="350" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="220" y="358" font-size="29" font-weight="800" text-anchor="middle" fill="#1d4ed8">−</text><text x="190" y="388" class="note">i+3</text>
  <circle cx="212" cy="220" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="212" y="228" font-size="29" font-weight="800" text-anchor="middle" fill="#1d4ed8">−</text><text x="160" y="211" class="note">i+4</text>
  <path d="M300 188 Q235 245 218 318" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 6"/><path d="M292 171 Q240 175 224 205" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 6"/><text x="320" y="442" class="note" text-anchor="middle">离子对或疏水接触可降低能量</text>
  <text x="880" y="120" class="label" text-anchor="middle" fill="#b91c1c">同号电荷：去稳定</text><circle cx="880" cy="280" r="132" fill="#fff1f2" stroke="#fda4af" stroke-width="3"/><circle cx="880" cy="280" r="42" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
  <g class="res"><circle cx="880" cy="165" r="28"/><circle cx="993" cy="260" r="28"/><circle cx="920" cy="389" r="28"/><circle cx="780" cy="350" r="28"/><circle cx="772" cy="220" r="28"/></g>
  <g fill="#fee2e2" stroke="#dc2626" stroke-width="3"><circle cx="880" cy="165" r="28"/><circle cx="780" cy="350" r="28"/><circle cx="772" cy="220" r="28"/></g><g font-size="28" font-weight="800" text-anchor="middle" fill="#b91c1c"><text x="880" y="173">+</text><text x="780" y="358">+</text><text x="772" y="228">+</text></g>
  <g stroke="#dc2626" stroke-width="4"><line x1="820" y1="235" x2="845" y2="260"/><line x1="845" y1="235" x2="820" y2="260"/><line x1="813" y1="303" x2="838" y2="328"/><line x1="838" y1="303" x2="813" y2="328"/></g><text x="880" y="442" class="note" text-anchor="middle">连续同号电荷产生排斥，破坏螺旋</text>
</svg>
