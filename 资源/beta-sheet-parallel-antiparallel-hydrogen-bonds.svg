<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
  <title id="title">平行与反平行 beta 折叠片的链方向和氢键几何</title><desc id="description">左侧的反平行 beta 片相邻股方向相反、氢键近似直线；右侧的平行 beta 片相邻股方向相同、氢键倾斜。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="strandBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="strandPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }.hbond { stroke: #16a06a; stroke-width: 4; stroke-dasharray: 8 7; }</style></defs>
  <rect width="1200" height="590" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="534" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">先看 N→C 箭头方向，再看股间氢键是否近似成直线</text><line x1="600" y1="100" x2="600" y2="510" stroke="#d8e0eb" stroke-width="2"/>
  <text x="315" y="125" class="label" text-anchor="middle" fill="#1d4ed8">反平行 antiparallel</text><text x="315" y="151" class="note" text-anchor="middle">相邻股方向相反</text>
  <g stroke="#2563eb" stroke-width="16" marker-end="url(#strandBlue)"><line x1="120" y1="220" x2="500" y2="220"/><line x1="500" y1="330" x2="120" y2="330"/></g><text x="95" y="226" class="label">N</text><text x="520" y="226" class="label">C</text><text x="520" y="336" class="label">N</text><text x="95" y="336" class="label">C</text>
  <g class="hbond"><line x1="175" y1="240" x2="175" y2="310"/><line x1="255" y1="240" x2="255" y2="310"/><line x1="335" y1="240" x2="335" y2="310"/><line x1="415" y1="240" x2="415" y2="310"/></g><g fill="#ffffff" stroke="#16a06a" stroke-width="2"><circle cx="175" cy="240" r="8"/><circle cx="175" cy="310" r="8"/><circle cx="255" cy="240" r="8"/><circle cx="255" cy="310" r="8"/><circle cx="335" cy="240" r="8"/><circle cx="335" cy="310" r="8"/><circle cx="415" cy="240" r="8"/><circle cx="415" cy="310" r="8"/></g>
  <rect x="105" y="395" width="420" height="92" rx="15" fill="#eff6ff"/><text x="315" y="428" class="label" text-anchor="middle" fill="#1d4ed8">氢键近似直线，几何更理想</text><text x="315" y="458" class="note" text-anchor="middle">重复周期约 0.70 nm；可只由 2 股组成</text>
  <text x="885" y="125" class="label" text-anchor="middle" fill="#6d28d9">平行 parallel</text><text x="885" y="151" class="note" text-anchor="middle">相邻股方向相同</text>
  <g stroke="#7c3aed" stroke-width="16" marker-end="url(#strandPurple)"><line x1="690" y1="220" x2="1070" y2="220"/><line x1="690" y1="330" x2="1070" y2="330"/></g><text x="665" y="226" class="label">N</text><text x="1090" y="226" class="label">C</text><text x="665" y="336" class="label">N</text><text x="1090" y="336" class="label">C</text>
  <g class="hbond"><line x1="745" y1="240" x2="790" y2="310"/><line x1="825" y1="240" x2="870" y2="310"/><line x1="905" y1="240" x2="950" y2="310"/><line x1="985" y1="240" x2="1030" y2="310"/></g><g fill="#ffffff" stroke="#16a06a" stroke-width="2"><circle cx="745" cy="240" r="8"/><circle cx="790" cy="310" r="8"/><circle cx="825" cy="240" r="8"/><circle cx="870" cy="310" r="8"/><circle cx="905" cy="240" r="8"/><circle cx="950" cy="310" r="8"/><circle cx="985" cy="240" r="8"/><circle cx="1030" cy="310" r="8"/></g>
  <rect x="675" y="395" width="420" height="92" rx="15" fill="#f5f3ff"/><text x="885" y="428" class="label" text-anchor="middle" fill="#6d28d9">氢键倾斜，单个几何略不理想</text><text x="885" y="458" class="note" text-anchor="middle">重复周期约 0.65 nm；通常需更多股稳定</text>
  <text x="600" y="530" class="note" text-anchor="middle" fill="#53657a">绿色虚线 = 主链 C=O···H—N 股间氢键</text>
</svg>
