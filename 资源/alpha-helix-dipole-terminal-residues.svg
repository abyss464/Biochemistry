<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">alpha 螺旋末端电荷与螺旋偶极的相互作用</title><desc id="description">对比负电残基位于带部分正电的 N 端且正电残基位于带部分负电的 C 端时的稳定作用，与电荷相反放置时的去稳定作用。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="450" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="394" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">螺旋偶极像一根短电棒：N 端部分正电，C 端部分负电</text>
  <rect x="65" y="105" width="500" height="275" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/><text x="315" y="138" class="label" text-anchor="middle" fill="#16744a">电荷互补 → 稳定</text><rect x="252" y="170" width="126" height="155" rx="60" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><text x="315" y="194" class="label" text-anchor="middle" fill="#dc2626">N端 δ+</text><text x="315" y="312" class="label" text-anchor="middle" fill="#2563eb">C端 δ−</text>
  <circle cx="190" cy="190" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="190" y="199" font-size="31" font-weight="800" text-anchor="middle" fill="#1d4ed8">−</text><text x="105" y="194" class="note">Asp / Glu</text><line x1="225" y1="190" x2="250" y2="190" stroke="#16a06a" stroke-width="5"/>
  <circle cx="440" cy="310" r="34" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="440" y="319" font-size="30" font-weight="800" text-anchor="middle" fill="#b91c1c">+</text><text x="480" y="315" class="note">Lys / Arg</text><line x1="380" y1="310" x2="405" y2="310" stroke="#16a06a" stroke-width="5"/>
  <rect x="635" y="105" width="500" height="275" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2.5"/><text x="885" y="138" class="label" text-anchor="middle" fill="#b91c1c">电荷同号 → 去稳定</text><rect x="822" y="170" width="126" height="155" rx="60" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><text x="885" y="194" class="label" text-anchor="middle" fill="#dc2626">N端 δ+</text><text x="885" y="312" class="label" text-anchor="middle" fill="#2563eb">C端 δ−</text>
  <circle cx="760" cy="190" r="34" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="760" y="199" font-size="30" font-weight="800" text-anchor="middle" fill="#b91c1c">+</text><circle cx="1010" cy="310" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1010" y="319" font-size="31" font-weight="800" text-anchor="middle" fill="#1d4ed8">−</text>
  <g stroke="#dc2626" stroke-width="5"><line x1="792" y1="173" x2="815" y2="196"/><line x1="815" y1="173" x2="792" y2="196"/><line x1="958" y1="293" x2="981" y2="316"/><line x1="981" y1="293" x2="958" y2="316"/></g><text x="885" y="356" class="note" text-anchor="middle">正电放 N 端或负电放 C 端都会排斥</text>
</svg>
