<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">丝心蛋白的反平行 beta 片和片层堆积</title><desc id="description">显示丝心蛋白的反平行 beta 股由股间氢键稳定，小侧链特别是每隔一个残基出现的甘氨酸使 beta 片能紧密堆积，片层间靠范德华力结合。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 16px; }.hbond { stroke: #16a06a; stroke-width: 3.5; stroke-dasharray: 8 6; }</style></defs>
  <rect width="1200" height="520" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="464" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">丝心蛋白：反平行 beta 片承受拉力，小侧链允许片层紧密堆积</text>
  <g stroke="#2563eb" stroke-width="15" marker-end="url(#blue)"><line x1="180" y1="175" x2="1010" y2="175"/><line x1="1010" y1="285" x2="180" y2="285"/></g><g class="hbond"><line x1="260" y1="195" x2="260" y2="265"/><line x1="390" y1="195" x2="390" y2="265"/><line x1="520" y1="195" x2="520" y2="265"/><line x1="650" y1="195" x2="650" y2="265"/><line x1="780" y1="195" x2="780" y2="265"/><line x1="910" y1="195" x2="910" y2="265"/></g><text x="1080" y="181" class="label">C</text><text x="105" y="181" class="label">N</text><text x="1080" y="291" class="label">N</text><text x="105" y="291" class="label">C</text>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="2"><circle cx="260" cy="130" r="20"/><circle cx="390" cy="325" r="20"/><circle cx="520" cy="130" r="20"/><circle cx="650" cy="325" r="20"/><circle cx="780" cy="130" r="20"/><circle cx="910" cy="325" r="20"/></g><g class="note" text-anchor="middle"><text x="260" y="136">Gly</text><text x="390" y="331">Gly</text><text x="520" y="136">Gly</text><text x="650" y="331">Gly</text><text x="780" y="136">Gly</text><text x="910" y="331">Gly</text></g>
  <path d="M220 365 L990 365" stroke="#7c3aed" stroke-width="14" marker-end="url(#purple)"/><g fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"><circle cx="300" cy="345" r="15"/><circle cx="430" cy="385" r="15"/><circle cx="560" cy="345" r="15"/><circle cx="690" cy="385" r="15"/><circle cx="820" cy="345" r="15"/><circle cx="950" cy="385" r="15"/></g><g stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 5"><line x1="300" y1="325" x2="300" y2="305"/><line x1="430" y1="365" x2="430" y2="335"/><line x1="560" y1="325" x2="560" y2="305"/><line x1="690" y1="365" x2="690" y2="335"/><line x1="820" y1="325" x2="820" y2="305"/></g><text x="600" y="425" class="note" text-anchor="middle">下一层 beta 片：Gly / Ala / Ser 的小侧链使层间靠近，范德华力累加</text>
  <line x1="145" y1="230" x2="70" y2="230" stroke="#dc2626" stroke-width="6" marker-end="url(#force)"/><line x1="1055" y1="230" x2="1130" y2="230" stroke="#dc2626" stroke-width="6" marker-end="url(#force)"/><text x="600" y="470" class="label" text-anchor="middle" fill="#b91c1c">主链已高度伸展 → 抗张强，但不易再拉长</text>
</svg>
