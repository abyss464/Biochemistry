<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">alpha 角蛋白的卷曲螺旋和二硫键重塑</title><desc id="description">左侧显示两条平行右手 alpha 螺旋相互缠绕成卷曲螺旋，右侧显示还原断开旧二硫键、改变链的相对位置，再氧化形成新二硫键以固定形状。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 16px; }</style></defs>
  <rect width="1200" height="540" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="484" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">角蛋白的强度来自“绳拧成缆”和链间交联</text><line x1="585" y1="100" x2="585" y2="470" stroke="#d8e0eb" stroke-width="2"/>
  <text x="300" y="120" class="label" text-anchor="middle" fill="#6d28d9">两条平行 alpha 螺旋 → 卷曲螺旋</text><line x1="300" y1="145" x2="300" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M215 155 C410 185 410 235 215 265 C20 295 20 345 215 375 C410 405 410 435 215 460" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/><path d="M385 155 C190 185 190 235 385 265 C580 295 580 345 385 375 C190 405 190 435 385 460" fill="none" stroke="#ea580c" stroke-width="18" stroke-linecap="round"/>
  <g fill="#ffffff" stroke-width="3"><circle cx="215" cy="155" r="18" stroke="#1d4ed8"/><circle cx="385" cy="155" r="18" stroke="#c2410c"/></g><text x="300" y="490" class="note" text-anchor="middle">单条是右手 alpha 螺旋；两条同向平行、彼此贴合后超扭曲</text><rect x="155" y="411" width="290" height="42" rx="12" fill="#ecfdf5" opacity="0.96"/><text x="300" y="439" class="label" text-anchor="middle" fill="#16744a">超扭曲分散拉力，增加强度</text>
  <text x="880" y="120" class="label" text-anchor="middle" fill="#a16207">烫发：二硫键断开后在新位置重建</text>
  <g stroke-linecap="round"><path d="M630 185 C690 220 650 330 710 365" fill="none" stroke="#7c3aed" stroke-width="11"/><path d="M750 185 C690 220 730 330 670 365" fill="none" stroke="#2563eb" stroke-width="11"/><line x1="683" y1="270" x2="717" y2="270" stroke="#d97706" stroke-width="7"/></g><text x="700" y="250" class="note" text-anchor="middle">S—S</text><text x="700" y="405" class="label" text-anchor="middle">① 旧交联</text>
  <line x1="770" y1="280" x2="835" y2="280" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="802" y="255" class="note" text-anchor="middle">还原</text>
  <g stroke-linecap="round"><path d="M855 185 C915 220 875 330 935 365" fill="none" stroke="#7c3aed" stroke-width="11"/><path d="M975 185 C915 220 955 330 895 365" fill="none" stroke="#2563eb" stroke-width="11"/></g><text x="900" y="275" class="note" fill="#a16207">SH</text><text x="948" y="275" class="note" fill="#a16207">HS</text><text x="915" y="405" class="label" text-anchor="middle">② 重排形状</text>
  <line x1="985" y1="280" x2="1045" y2="280" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="1015" y="255" class="note" text-anchor="middle">氧化</text>
  <g stroke-linecap="round"><path d="M1060 185 C1130 225 1070 320 1140 365" fill="none" stroke="#7c3aed" stroke-width="11"/><path d="M1140 185 C1070 225 1130 320 1060 365" fill="none" stroke="#2563eb" stroke-width="11"/><line x1="1087" y1="292" x2="1118" y2="292" stroke="#d97706" stroke-width="7"/></g><text x="1102" y="276" class="note" text-anchor="middle">S—S</text><text x="1100" y="405" class="label" text-anchor="middle">③ 新交联定型</text><text x="880" y="460" class="note" text-anchor="middle">二硫键不决定 alpha 螺旋本身，而是在角蛋白链之间固定宏观形状</text>
</svg>
