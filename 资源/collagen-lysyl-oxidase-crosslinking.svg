<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">胶原赖氨酸氧化与共价交联</title><desc id="description">赖氨酸残基在含铜赖氨酰氧化酶作用下转化为醛基赖氨酸，随后通过非酶促醛醇缩合在胶原分子之间形成共价交联；beta 氨基丙腈抑制此过程，交联过多则使老化胶原变硬变脆。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 16px; }.chain { stroke-width: 12; stroke-linecap: round; }</style></defs>
  <rect width="1200" height="470" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="414" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">赖氨酰氧化酶先制造反应性醛基，再由非酶促缩合把胶原分子锁在一起</text>
  <rect x="60" y="110" width="240" height="215" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/><text x="180" y="145" class="label" text-anchor="middle">Lys 侧链</text><path d="M95 225 L245 225" class="chain" stroke="#2563eb"/><circle cx="180" cy="225" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="180" y="232" class="note" text-anchor="middle">NH2</text><text x="180" y="285" class="note" text-anchor="middle">还原型，交联反应性低</text>
  <line x1="310" y1="220" x2="445" y2="220" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="377" y="165" class="label" text-anchor="middle" fill="#a16207">Lysyl oxidase</text><text x="377" y="192" class="note" text-anchor="middle">Cu2+ · O2</text><rect x="325" y="245" width="105" height="55" rx="12" fill="#fff1f2"/><text x="377" y="278" class="note" text-anchor="middle" fill="#b91c1c">BAPN 抑制</text>
  <rect x="455" y="110" width="240" height="215" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/><text x="575" y="145" class="label" text-anchor="middle">Allysine</text><path d="M490 225 L640 225" class="chain" stroke="#ea580c"/><circle cx="575" cy="225" r="23" fill="#ffffff" stroke="#ea580c" stroke-width="3"/><text x="575" y="232" class="note" text-anchor="middle">CHO</text><text x="575" y="285" class="note" text-anchor="middle">醛基赖氨酸，反应性高</text>
  <line x1="705" y1="220" x2="815" y2="220" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="760" y="175" class="label" text-anchor="middle" fill="#16744a">自发醛醇缩合</text><text x="760" y="202" class="note" text-anchor="middle">非酶促</text>
  <rect x="825" y="110" width="310" height="215" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/><text x="980" y="145" class="label" text-anchor="middle" fill="#16744a">分子间共价交联</text><path d="M860 195 L1100 195" class="chain" stroke="#2563eb"/><path d="M860 265 L1100 265" class="chain" stroke="#7c3aed"/><line x1="930" y1="205" x2="930" y2="255" stroke="#d97706" stroke-width="7"/><line x1="1025" y1="205" x2="1025" y2="255" stroke="#d97706" stroke-width="7"/><text x="980" y="300" class="note" text-anchor="middle">抵抗滑移，提高抗张强度</text>
  <rect x="180" y="355" width="840" height="55" rx="14" fill="#f5f3ff"/><text x="600" y="380" class="note" text-anchor="middle"><tspan font-weight="700" fill="#6d28d9">交联不足：</tspan><tspan>BAPN 抑制 → 山黎豆中毒、组织强度下降</tspan><tspan dx="40" font-weight="700" fill="#b91c1c">交联过多：</tspan><tspan>随年龄增加 → 变硬、变脆</tspan></text>
</svg>
