<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">多结构域蛋白的分段折叠、外显子模块与铰链运动</title><desc id="description">长多肽链的两个序列区段分别折叠为两个结构域，结构域通过共价连续的柔性铰链相连，相对闭合时在交界面包围底物；下方显示外显子常与结构域模块对应。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 16px; }</style></defs>
  <rect width="1200" height="560" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="504" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">多结构域设计同时解决“长链怎样折”和“活性位点怎样动”</text>
  <rect x="60" y="108" width="310" height="245" rx="18" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2.5"/><text x="215" y="142" class="label" text-anchor="middle">① 序列分段</text><line x1="95" y1="210" x2="335" y2="210" stroke="#64748b" stroke-width="5"/><rect x="105" y="180" width="95" height="60" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="230" y="180" width="95" height="60" rx="15" fill="#dcfce7" stroke="#16a06a" stroke-width="3"/><text x="152" y="216" class="note" text-anchor="middle">Domain A</text><text x="277" y="216" class="note" text-anchor="middle">Domain B</text><text x="215" y="285" class="note" text-anchor="middle">100–200 残基左右的局部区段</text><text x="215" y="315" class="note" text-anchor="middle">可各自形成稳定折叠核</text>
  <line x1="380" y1="225" x2="455" y2="225" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="470" y="108" width="310" height="245" rx="18" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2.5"/><text x="625" y="142" class="label" text-anchor="middle">② 分别折叠后缔合</text><path d="M520 195 C560 145 625 165 635 220 C645 275 570 310 525 270 C495 242 498 216 520 195 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M690 195 C730 145 775 185 760 245 C748 300 680 305 650 260 C628 228 655 202 690 195 Z" fill="#dcfce7" stroke="#16a06a" stroke-width="3"/><path d="M620 235 Q640 215 660 235" fill="none" stroke="#d97706" stroke-width="6" stroke-dasharray="7 5"/><text x="640" y="330" class="note" text-anchor="middle">共价连续的柔性铰链保持两域相连</text>
  <line x1="790" y1="225" x2="865" y2="225" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="880" y="108" width="260" height="245" rx="18" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2.5"/><text x="1010" y="142" class="label" text-anchor="middle">③ 铰链闭合</text><path d="M915 215 C930 160 990 160 1010 215 L995 285 C955 300 915 270 915 215 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M1105 215 C1090 160 1030 160 1010 215 L1025 285 C1065 300 1105 270 1105 215 Z" fill="#dcfce7" stroke="#16a06a" stroke-width="3"/><circle cx="1010" cy="235" r="24" fill="#f59e0b" stroke="#b45309" stroke-width="3"/><text x="1010" y="241" class="note" text-anchor="middle">底物</text><path d="M930 175 Q1010 100 1090 175" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#curve)"/><text x="1010" y="328" class="note" text-anchor="middle">活性中心常位于两域交界面</text>
  <rect x="85" y="390" width="1030" height="100" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="115" y="420" class="label" fill="#6d28d9">常见的 exon–domain 模块对应</text><g><rect x="390" y="406" width="140" height="42" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="540" y="406" width="140" height="42" rx="10" fill="#dcfce7" stroke="#16a06a" stroke-width="2"/><text x="460" y="433" class="note" text-anchor="middle">Exon A</text><text x="610" y="433" class="note" text-anchor="middle">Exon B</text><line x1="460" y1="452" x2="460" y2="470" stroke="#64748b" stroke-width="2"/><line x1="610" y1="452" x2="610" y2="470" stroke="#64748b" stroke-width="2"/><rect x="700" y="406" width="140" height="42" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="850" y="406" width="140" height="42" rx="20" fill="#dcfce7" stroke="#16a06a" stroke-width="2"/><text x="770" y="433" class="note" text-anchor="middle">Domain A</text><text x="920" y="433" class="note" text-anchor="middle">Domain B</text></g><text x="600" y="478" class="note" text-anchor="middle">“常对应”是进化模块化倾向，不是每个结构域都必然由单一外显子精确编码</text>
</svg>
