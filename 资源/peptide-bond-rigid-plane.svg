<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">肽键的共振与刚性平面</title>
  <desc id="description">肽键电子离域使 C-N 键具有部分双键性质，并使与肽键相关的六个原子共平面。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }
      .heading { font-size: 27px; font-weight: 750; }
      .label { font-size: 20px; font-weight: 650; }
      .note { font-size: 18px; }
      .bond { stroke: #263449; stroke-width: 5; stroke-linecap: round; }
      .peptide { stroke: #dc2626; stroke-width: 8; stroke-linecap: round; }
      .atom { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .atom-text { font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#f6f8fc"/>
  <rect x="30" y="30" width="1140" height="440" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="60" y="75" class="heading">从电子离域到刚性肽平面</text>
  <line x1="510" y1="100" x2="510" y2="435" stroke="#d8e0eb" stroke-width="2"/>

  <text x="65" y="125" class="label" fill="#42556d">① 肽键是共振杂化体</text>
  <g transform="translate(75 165)">
    <text x="0" y="55" font-size="31" font-weight="700">O=C</text>
    <text x="70" y="55" font-size="31" font-weight="800" fill="#dc2626">—N</text>
    <text x="124" y="55" font-size="31" font-weight="700">—H</text>
    <text x="188" y="55" font-size="39" font-weight="700" fill="#64748b">↔</text>
    <text x="242" y="55" font-size="31" font-weight="700">⁻O—C</text>
    <text x="332" y="55" font-size="31" font-weight="800" fill="#dc2626">=N⁺</text>
    <text x="395" y="55" font-size="31" font-weight="700">—H</text>
  </g>
  <rect x="75" y="260" width="390" height="115" rx="16" fill="#fff1f2" stroke="#f3a6ae" stroke-width="2"/>
  <text x="270" y="302" class="label" text-anchor="middle" fill="#b91c1c">C—N 具部分双键性质</text>
  <text x="270" y="340" class="note" text-anchor="middle">键长变短，绕键轴旋转受限</text>
  <text x="270" y="416" class="note" text-anchor="middle" fill="#53657a">共振是“刚性”的电子结构根源</text>

  <text x="545" y="125" class="label" fill="#42556d">② 与肽键相关的 6 个原子共平面</text>
  <polygon points="550,330 660,175 1025,155 1135,310 1010,420 650,412" fill="#dbeafe" stroke="#75a6df" stroke-width="2.5" opacity="0.78"/>
  <line x1="625" y1="315" x2="760" y2="250" class="bond"/>
  <line x1="760" y1="250" x2="900" y2="315" class="peptide"/>
  <line x1="900" y1="315" x2="1050" y2="250" class="bond"/>
  <line x1="752" y1="238" x2="782" y2="178" class="bond"/>
  <line x1="764" y1="244" x2="794" y2="184" class="bond"/>
  <line x1="900" y1="329" x2="900" y2="385" class="bond"/>
  <g>
    <circle cx="625" cy="315" r="30" class="atom"/><text x="625" y="315" class="atom-text">Cαᵢ</text>
    <circle cx="760" cy="250" r="27" class="atom"/><text x="760" y="250" class="atom-text">Cᵢ</text>
    <circle cx="900" cy="315" r="27" class="atom"/><text x="900" y="315" class="atom-text">Nᵢ₊₁</text>
    <circle cx="1050" cy="250" r="35" class="atom"/><text x="1050" y="250" class="atom-text">Cαᵢ₊₁</text>
    <circle cx="790" cy="165" r="24" class="atom"/><text x="790" y="165" class="atom-text">Oᵢ</text>
    <circle cx="900" cy="408" r="25" class="atom"/><text x="900" y="408" class="atom-text">Hᵢ₊₁</text>
  </g>
  <text x="1090" y="375" class="label" text-anchor="end" fill="#2d6ca8">肽平面</text>
  <text x="685" y="450" class="note" fill="#53657a">C=O 与 N—H 分居 C—N 肽键两侧（反式）</text>
</svg>
