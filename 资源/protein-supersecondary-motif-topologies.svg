<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">六种常见超二级结构模体的拓扑</title><desc id="description">以 alpha 螺旋为紫色曲线、beta 股为蓝色箭头，分别示意 alpha-alpha 卷曲螺旋、beta-alpha-beta 单元、beta 发夹、Rossmann 折叠、beta 曲折和希腊钥匙拓扑。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 15px; }.panel { fill: #fbfcfe; stroke: #cbd5e1; stroke-width: 2; }.beta { stroke: #2563eb; stroke-width: 13; marker-end: url(#blue); }.helix { fill: none; stroke: #7c3aed; stroke-width: 11; stroke-linecap: round; }.loop { fill: none; stroke: #64748b; stroke-width: 4; }</style></defs>
  <rect width="1200" height="700" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="644" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">拓扑图只保留“元件顺序、方向和连接方式”，不是蛋白质的照片</text>
  <g transform="translate(60 105)"><rect width="340" height="245" rx="18" class="panel"/><text x="170" y="35" class="label" text-anchor="middle">alpha-alpha（卷曲螺旋）</text><path d="M105 65 C250 90 250 125 105 150 C-40 175 -40 205 105 225" class="helix"/><path d="M235 65 C90 90 90 125 235 150 C380 175 380 205 235 225" class="helix" stroke="#ea580c"/><text x="170" y="230" class="note" text-anchor="middle">两条 alpha 螺旋相互缠绕</text></g>
  <g transform="translate(430 105)"><rect width="340" height="245" rx="18" class="panel"/><text x="170" y="35" class="label" text-anchor="middle">beta-alpha-beta</text><line x1="45" y1="175" x2="125" y2="175" class="beta"/><path d="M130 175 C145 90 215 90 230 175" class="loop"/><path d="M145 160 C125 130 230 130 210 100 C190 70 125 90 145 60" class="helix"/><line x1="230" y1="175" x2="310" y2="175" class="beta"/><text x="170" y="222" class="note" text-anchor="middle">两条平行 beta 股由 alpha 螺旋跨接</text></g>
  <g transform="translate(800 105)"><rect width="340" height="245" rx="18" class="panel"/><text x="170" y="35" class="label" text-anchor="middle">beta-beta（beta 发夹）</text><line x1="45" y1="105" x2="285" y2="105" class="beta"/><path d="M300 105 Q330 150 300 195" class="loop"/><line x1="300" y1="195" x2="60" y2="195" class="beta"/><text x="170" y="230" class="note" text-anchor="middle">两条反平行 beta 股由短转角连接</text></g>
  <g transform="translate(60 385)"><rect width="340" height="245" rx="18" class="panel"/><text x="170" y="35" class="label" text-anchor="middle">Rossmann 折叠</text><g><line x1="45" y1="145" x2="115" y2="145" class="beta"/><line x1="135" y1="145" x2="205" y2="145" class="beta"/><line x1="225" y1="145" x2="295" y2="145" class="beta"/></g><path d="M65 95 C45 65 135 65 115 40" class="helix"/><path d="M205 215 C185 185 275 185 255 160" class="helix"/><text x="170" y="225" class="note" text-anchor="middle">平行 beta 片与两侧 alpha 螺旋反复组合</text></g>
  <g transform="translate(430 385)"><rect width="340" height="245" rx="18" class="panel"/><text x="170" y="35" class="label" text-anchor="middle">beta-meander（beta 曲折）</text><line x1="45" y1="80" x2="285" y2="80" class="beta"/><path d="M300 80 Q330 115 300 145" class="loop"/><line x1="300" y1="145" x2="60" y2="145" class="beta"/><path d="M45 145 Q15 180 45 210" class="loop"/><line x1="45" y1="210" x2="285" y2="210" class="beta"/><text x="170" y="233" class="note" text-anchor="middle">连续发夹产生多条反平行 beta 股</text></g>
  <g transform="translate(800 385)"><rect width="340" height="245" rx="18" class="panel"/><text x="170" y="35" class="label" text-anchor="middle">Greek key（希腊钥匙）</text><g class="beta"><line x1="45" y1="75" x2="45" y2="190"/><line x1="120" y1="190" x2="120" y2="75"/><line x1="195" y1="75" x2="195" y2="190"/><line x1="270" y1="190" x2="270" y2="75"/></g><path d="M120 60 Q158 40 195 60 M195 205 Q232 225 270 205 M270 60 C315 20 80 20 45 60" class="loop"/><g class="note" text-anchor="middle"><text x="45" y="220">4</text><text x="120" y="220">1</text><text x="195" y="220">2</text><text x="270" y="220">3</text></g><text x="170" y="238" class="note" text-anchor="middle">片内空间顺序 4–1–2–3；3→4 长跨越</text></g>
</svg>
