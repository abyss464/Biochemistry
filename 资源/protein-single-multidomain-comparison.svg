<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">单结构域蛋白与多结构域蛋白的比较</title><desc id="description">左侧显示小蛋白的整条多肽链折成一个紧密结构域，右侧显示多结构域蛋白由多个相对独立的折叠块通过柔性连接段组成，并以免疫球蛋白轻链两个域、重链四个域为例。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">结构域是紧密的局部折叠实体：小蛋白常只有一个，大蛋白常由多个域拼接</text>
  <rect x="65" y="110" width="420" height="310" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/><text x="275" y="145" class="label" text-anchor="middle" fill="#1d4ed8">单结构域 protein</text><path d="M190 185 C265 130 390 190 385 285 C380 390 215 395 160 310 C125 255 145 215 190 185 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M205 310 C175 270 290 270 260 225 C230 180 180 210 210 170" fill="none" stroke="#7c3aed" stroke-width="11"/><line x1="280" y1="285" x2="355" y2="285" stroke="#2563eb" stroke-width="13"/><polygon points="355,265 395,285 355,305" fill="#2563eb"/><text x="275" y="377" class="label" text-anchor="middle">整条链 = 1 个独立折叠单位</text><text x="275" y="405" class="note" text-anchor="middle">小蛋白中，domain 几乎就是整个三级结构</text>
  <rect x="520" y="110" width="615" height="310" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2.5"/><text x="827" y="145" class="label" text-anchor="middle" fill="#6d28d9">多结构域 protein</text>
  <text x="610" y="190" class="label">免疫球蛋白轻链</text><line x1="800" y1="182" x2="1040" y2="182" stroke="#64748b" stroke-width="4"/><rect x="815" y="155" width="95" height="55" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="930" y="155" width="95" height="55" rx="25" fill="#dcfce7" stroke="#16a06a" stroke-width="3"/><text x="862" y="189" class="note" text-anchor="middle">V domain</text><text x="977" y="189" class="note" text-anchor="middle">C domain</text>
  <text x="610" y="285" class="label">免疫球蛋白重链</text><line x1="800" y1="277" x2="1110" y2="277" stroke="#64748b" stroke-width="4"/><g stroke-width="3"><rect x="800" y="250" width="68" height="55" rx="25" fill="#dbeafe" stroke="#2563eb"/><rect x="880" y="250" width="68" height="55" rx="25" fill="#dcfce7" stroke="#16a06a"/><rect x="960" y="250" width="68" height="55" rx="25" fill="#fef3c7" stroke="#d97706"/><rect x="1040" y="250" width="68" height="55" rx="25" fill="#fee2e2" stroke="#dc2626"/></g><g class="note" text-anchor="middle"><text x="834" y="284">V</text><text x="914" y="284">C1</text><text x="994" y="284">C2</text><text x="1074" y="284">C3</text></g>
  <text x="827" y="350" class="label" text-anchor="middle">每个彩色块都有独立的折叠核心</text><text x="827" y="382" class="note" text-anchor="middle">结构域在同一条多肽链上由连接肽段串联</text><text x="827" y="408" class="note" text-anchor="middle">多个域缔合后才是整个蛋白的三级结构</text>
</svg>
