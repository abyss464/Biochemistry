<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">beta 股的锯齿状主链与交替侧链</title><desc id="description">从侧面显示伸展的 beta 股主链呈锯齿状，C alpha 位于折点，侧链 R 交替伸向 beta 片平面的上方与下方。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="430" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="374" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">单条 beta 股是伸展的“折纸带”，不是平直的一条线</text>
  <path d="M100 225 L220 165 L340 225 L460 165 L580 225 L700 165 L820 225 L940 165 L1080 225" fill="none" stroke="#7c3aed" stroke-width="13" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g fill="#ffffff" stroke="#5b21b6" stroke-width="3"><circle cx="220" cy="165" r="24"/><circle cx="340" cy="225" r="24"/><circle cx="460" cy="165" r="24"/><circle cx="580" cy="225" r="24"/><circle cx="700" cy="165" r="24"/><circle cx="820" cy="225" r="24"/><circle cx="940" cy="165" r="24"/></g><g class="note" text-anchor="middle"><text x="220" y="171">Cα</text><text x="340" y="231">Cα</text><text x="460" y="171">Cα</text><text x="580" y="231">Cα</text><text x="700" y="171">Cα</text><text x="820" y="231">Cα</text><text x="940" y="171">Cα</text></g>
  <g stroke="#ea580c" stroke-width="5"><line x1="220" y1="140" x2="220" y2="105"/><line x1="340" y1="250" x2="340" y2="285"/><line x1="460" y1="140" x2="460" y2="105"/><line x1="580" y1="250" x2="580" y2="285"/><line x1="700" y1="140" x2="700" y2="105"/><line x1="820" y1="250" x2="820" y2="285"/><line x1="940" y1="140" x2="940" y2="105"/></g><g fill="#f59e0b" stroke="#c2410c" stroke-width="2"><circle cx="220" cy="92" r="18"/><circle cx="340" cy="298" r="18"/><circle cx="460" cy="92" r="18"/><circle cx="580" cy="298" r="18"/><circle cx="700" cy="92" r="18"/><circle cx="820" cy="298" r="18"/><circle cx="940" cy="92" r="18"/></g><g class="label" text-anchor="middle" fill="#9a3412"><text x="220" y="99">R</text><text x="340" y="305">R</text><text x="460" y="99">R</text><text x="580" y="305">R</text><text x="700" y="99">R</text><text x="820" y="305">R</text><text x="940" y="99">R</text></g>
  <text x="90" y="193" class="label" fill="#16744a">N 端</text><text x="1055" y="260" class="label" fill="#16744a">C 端</text><text x="600" y="355" class="note" text-anchor="middle">两个残基构成一个锯齿重复；侧链不塞在片内，而是交替伸向片面两侧</text>
</svg>
