<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">X 射线晶体学解析蛋白质结构的流程</title><desc id="description">从蛋白质晶体、X 射线照射和衍射斑点，经相位求解和傅里叶变换得到电子密度，最后构建原子模型。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3979b8"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }.box { fill: #f8fbff; stroke: #7aa7df; stroke-width: 2.5; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">X 射线晶体学：实验先得到衍射数据，再重建三维结构</text>
  <g>
    <rect x="58" y="112" width="205" height="250" rx="18" class="box"/><text x="160" y="145" class="label" text-anchor="middle">① 蛋白质晶体</text>
    <g fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"><circle cx="104" cy="202" r="12"/><circle cx="145" cy="178" r="12"/><circle cx="186" cy="202" r="12"/><circle cx="227" cy="178" r="12"/><circle cx="104" cy="250" r="12"/><circle cx="145" cy="226" r="12"/><circle cx="186" cy="250" r="12"/><circle cx="227" cy="226" r="12"/><circle cx="104" cy="298" r="12"/><circle cx="145" cy="274" r="12"/><circle cx="186" cy="298" r="12"/><circle cx="227" cy="274" r="12"/></g><text x="160" y="338" class="note" text-anchor="middle">周期性排列放大散射信号</text>
    <rect x="320" y="112" width="205" height="250" rx="18" class="box"/><text x="422" y="145" class="label" text-anchor="middle">② X 射线衍射</text>
    <path d="M340 230 L405 230" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow)"/><polygon points="418,178 474,208 474,272 418,302 382,240" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><g stroke="#7c3aed" stroke-width="3"><line x1="445" y1="220" x2="500" y2="180"/><line x1="445" y1="230" x2="505" y2="230"/><line x1="445" y1="240" x2="500" y2="285"/></g><text x="422" y="338" class="note" text-anchor="middle">nλ = 2d sinθ（Bragg）</text>
    <rect x="582" y="112" width="205" height="250" rx="18" class="box"/><text x="684" y="145" class="label" text-anchor="middle">③ 衍射斑点</text>
    <rect x="625" y="170" width="118" height="130" rx="8" fill="#172033"/><g fill="#f8fafc"><circle cx="684" cy="235" r="7"/><circle cx="650" cy="202" r="5"/><circle cx="718" cy="202" r="5"/><circle cx="650" cy="268" r="5"/><circle cx="718" cy="268" r="5"/><circle cx="684" cy="187" r="4"/><circle cx="684" cy="283" r="4"/><circle cx="638" cy="235" r="4"/><circle cx="730" cy="235" r="4"/></g><text x="684" y="338" class="note" text-anchor="middle">位置 + 强度，不是原子照片</text>
    <rect x="844" y="112" width="298" height="250" rx="18" class="box"/><text x="993" y="145" class="label" text-anchor="middle">④ 电子密度 → 原子模型</text>
    <g fill="none" stroke="#22c55e" stroke-width="3" opacity="0.8"><ellipse cx="935" cy="225" rx="60" ry="35"/><ellipse cx="935" cy="225" rx="43" ry="25"/><ellipse cx="1035" cy="245" rx="65" ry="38"/><ellipse cx="1035" cy="245" rx="45" ry="25"/></g><path d="M888 258 C930 205 970 276 1014 222 C1050 180 1086 242 1110 202" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/><g fill="#f59e0b"><circle cx="905" cy="245" r="8"/><circle cx="954" cy="238" r="8"/><circle cx="1004" cy="231" r="8"/><circle cx="1050" cy="210" r="8"/><circle cx="1094" cy="210" r="8"/></g><text x="993" y="321" class="note" text-anchor="middle">相位求解 + 傅里叶变换 + 模型修正</text><text x="993" y="345" class="note" text-anchor="middle">最终产物是拟合密度的结构模型</text>
  </g>
  <g stroke="#3979b8" stroke-width="5" marker-end="url(#arrow)"><line x1="270" y1="237" x2="307" y2="237"/><line x1="532" y1="237" x2="569" y2="237"/><line x1="794" y1="237" x2="831" y2="237"/></g>
  <text x="600" y="423" class="note" text-anchor="middle" fill="#53657a">晶体学给出晶格中的时间/空间平均结构；分辨率取决于数据质量与晶体有序度</text>
</svg>
