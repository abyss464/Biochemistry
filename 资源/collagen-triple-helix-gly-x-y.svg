<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">胶原三股螺旋的嵌套手性和 Gly-X-Y 重复</title><desc id="description">三条左手胶原 alpha 链同向缠绕成右手超螺旋，每三个残基一个的甘氨酸位于狭窄中心，X 常为脏氨酸，Y 常为羟脏氨酸。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="570" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="514" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">三条“左手单链”缠成一条“右手超螺旋缆”</text><line x1="710" y1="105" x2="710" y2="500" stroke="#d8e0eb" stroke-width="2"/>
  <line x1="360" y1="115" x2="360" y2="495" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M210 130 C600 165 600 220 210 255 C50 290 50 345 210 380 C600 415 600 460 210 495" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/><path d="M510 130 C120 165 120 220 510 255 C670 290 670 345 510 380 C120 415 120 460 510 495" fill="none" stroke="#ea580c" stroke-width="16" stroke-linecap="round"/><path d="M360 130 C100 190 620 210 360 270 C100 330 620 350 360 410 C100 470 620 490 360 520" fill="none" stroke="#16a06a" stroke-width="16" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#b45309" stroke-width="3"><circle cx="360" cy="180" r="22"/><circle cx="360" cy="305" r="22"/><circle cx="360" cy="430" r="22"/></g><g class="note" text-anchor="middle" fill="#92400e"><text x="360" y="187">Gly</text><text x="360" y="312">Gly</text><text x="360" y="437">Gly</text></g><text x="95" y="120" class="label" fill="#6d28d9">总体：右手超螺旋</text><text x="360" y="550" class="note" text-anchor="middle">三条链同向平行；每条自身为左手螺旋</text>
  <text x="940" y="125" class="label" text-anchor="middle">(Gly–X–Y)n 序列像齿轮一样对位</text><g transform="translate(770 165)"><g><rect x="0" y="0" width="95" height="58" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="105" y="0" width="95" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="210" y="0" width="95" height="58" rx="12" fill="#dcfce7" stroke="#16a06a" stroke-width="2"/></g><g class="label" text-anchor="middle"><text x="47" y="36">Gly</text><text x="152" y="36">X</text><text x="257" y="36">Y</text></g><text x="152" y="95" class="note" text-anchor="middle">X 常为 Pro；Y 常为 Hyp</text><path d="M47 115 L47 260" stroke="#d97706" stroke-width="5"/><text x="75" y="155" class="note" fill="#92400e">Gly 无侧链拥挤</text><text x="75" y="182" class="note" fill="#92400e">每 3 位进入狭窄中心</text><circle cx="47" cy="245" r="25" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><circle cx="137" cy="245" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="247" cy="245" r="45" fill="#dcfce7" stroke="#16a06a" stroke-width="3"/><text x="47" y="252" class="note" text-anchor="middle">H</text><text x="137" y="252" class="note" text-anchor="middle">Pro</text><text x="247" y="252" class="note" text-anchor="middle">Hyp</text></g>
  <rect x="760" y="455" width="365" height="58" rx="14" fill="#f5f3ff"/><text x="942" y="480" class="note" text-anchor="middle">每残基沿轴上升 0.29 nm</text><text x="942" y="503" class="note" text-anchor="middle">原胶原：长约 300 nm，直径约 1.5 nm</text>
</svg>
