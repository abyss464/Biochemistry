<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title description">
  <title id="title">beta 转角与 gamma 转角的残基数和氢键比较</title><desc id="description">左侧显示 beta 转角由四个残基构成一百八十度回折，第 i 个残基的羧基与第 i+3 个残基的酰胺氢形成氢键；右侧的 gamma 转角由三个残基构成 i 到 i+2 氢键。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }.res { fill: #ffffff; stroke: #7c3aed; stroke-width: 3; }</style></defs>
  <rect width="1200" height="510" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="454" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">数清残基数，再看氢键跨越几个位点</text><line x1="760" y1="100" x2="760" y2="440" stroke="#d8e0eb" stroke-width="2"/>
  <text x="390" y="120" class="label" text-anchor="middle" fill="#1d4ed8">beta 转角：4 残基、180° 回折</text>
  <g stroke="#2563eb" stroke-width="15" fill="none" stroke-linecap="round"><path d="M105 300 L250 300 C330 300 330 190 355 190 C420 140 520 190 575 300 L575 380 L130 380" marker-end="url(#blueArrow)"/></g>
  <g class="res"><circle cx="250" cy="300" r="31"/><circle cx="355" cy="190" r="31"/><circle cx="465" cy="190" r="31"/><circle cx="575" cy="300" r="31"/></g><g class="label" text-anchor="middle"><text x="250" y="307">i</text><text x="355" y="197">i+1</text><text x="465" y="197">i+2</text><text x="575" y="307">i+3</text></g>
  <circle cx="250" cy="340" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="347" class="note" text-anchor="middle">C=O</text><circle cx="575" cy="340" r="27" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="575" y="347" class="note" text-anchor="middle">H—N</text><line x1="278" y1="340" x2="545" y2="340" stroke="#16a06a" stroke-width="4" stroke-dasharray="8 7"/><text x="410" y="372" class="note" text-anchor="middle" fill="#16744a">i → i+3 氢键</text>
  <rect x="310" y="420" width="305" height="40" rx="12" fill="#fff7ed"/><text x="462" y="447" class="note" text-anchor="middle"><tspan font-weight="700" fill="#c2410c">II 型：i+2 必须是 Gly</tspan><tspan dx="18">Pro 也常见</tspan></text>
  <text x="965" y="120" class="label" text-anchor="middle" fill="#6d28d9">gamma 转角：3 残基</text><path d="M800 300 L840 300 C875 300 875 190 950 190 C1025 190 1035 300 1080 300 L1080 380 L825 380" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round"/><g class="res"><circle cx="840" cy="300" r="29"/><circle cx="950" cy="190" r="29"/><circle cx="1080" cy="300" r="29"/></g><g class="label" text-anchor="middle"><text x="840" y="307">i</text><text x="950" y="197">i+1</text><text x="1080" y="307">i+2</text></g><line x1="855" y1="340" x2="1065" y2="340" stroke="#16a06a" stroke-width="4" stroke-dasharray="8 7"/><text x="960" y="370" class="note" text-anchor="middle" fill="#16744a">i → i+2 氢键</text><text x="960" y="420" class="note" text-anchor="middle">比 beta 转角少 1 个残基</text>
</svg>
