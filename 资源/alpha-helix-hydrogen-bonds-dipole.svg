<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">alpha 螺旋的 i 到 i+4 氢键和螺旋偶极</title><desc id="description">左侧示意第 i 个残基的羧基与第 i+4 个残基的酰胺氢形成氢键，右侧显示肽键偶极同向排列，使 N 端带部分正电、C 端带部分负电。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="560" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="504" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="75" class="heading">局部的 i → i+4 氢键沿轴累加，同时产生整体螺旋偶极</text>
  <line x1="760" y1="105" x2="760" y2="490" stroke="#d8e0eb" stroke-width="2"/>
  <text x="390" y="120" class="label" text-anchor="middle" fill="#1d4ed8">C=O(i) ··· H—N(i+4)</text>
  <line x1="405" y1="135" x2="405" y2="470" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="none" stroke-linecap="round"><path d="M265 150 C265 115 545 115 545 150 C545 185 265 185 265 220 C265 255 545 255 545 290 C545 325 265 325 265 360 C265 395 545 395 545 430" stroke="#c4b5fd" stroke-width="17" opacity="0.65"/><path d="M545 150 C545 185 265 185 265 220 M545 290 C545 325 265 325 265 360" stroke="#7c3aed" stroke-width="18"/></g>
  <g class="note" text-anchor="middle"><circle cx="285" cy="150" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="285" y="156">O(i)</text><circle cx="285" cy="360" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="285" y="366">H—N</text><text x="285" y="394" fill="#0369a1">(i+4)</text></g>
  <line x1="285" y1="176" x2="285" y2="330" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 7"/><text x="120" y="252" class="label" fill="#1d4ed8">氢键</text><text x="90" y="279" class="note">方向近似平行于螺旋轴</text>
  <path d="M315 330 C350 365 430 375 465 330" fill="none" stroke="#16a06a" stroke-width="3"/><text x="390" y="410" class="label" text-anchor="middle" fill="#16744a">封闭成 13 元环</text><text x="390" y="445" class="note" text-anchor="middle">3.6 残基/圈 + 13 元氢键环 → 3.6₁₃ 螺旋</text>
  <text x="960" y="120" class="label" text-anchor="middle">肽键偶极同向排列</text><rect x="865" y="165" width="190" height="285" rx="90" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="960" y="195" font-size="27" font-weight="800" text-anchor="middle" fill="#dc2626">N 端　δ+</text><text x="960" y="430" font-size="27" font-weight="800" text-anchor="middle" fill="#2563eb">C 端　δ−</text>
  <g stroke="#dc2626" stroke-width="4" marker-end="url(#down)"><line x1="910" y1="230" x2="910" y2="285"/><line x1="960" y1="230" x2="960" y2="285"/><line x1="1010" y1="230" x2="1010" y2="285"/><line x1="910" y1="305" x2="910" y2="360"/><line x1="960" y1="305" x2="960" y2="360"/><line x1="1010" y1="305" x2="1010" y2="360"/></g><text x="960" y="475" class="note" text-anchor="middle">单个肽键偶极小，沿轴叠加后形成宏观偶极</text>
</svg>
