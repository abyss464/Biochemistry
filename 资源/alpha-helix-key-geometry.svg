<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">alpha 螺旋的关键几何参数</title><desc id="description">以侧视和俯视示意右手 alpha 螺旋，标出每圈 3.6 个残基、0.54 纳米螺距、0.15 纳米每残基上升、100 度旋转和约 0.5 纳米直径。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="570" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="514" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="75" class="heading">右手 alpha 螺旋的参数都是围绕同一根螺旋轴定义的</text>
  <line x1="495" y1="115" x2="495" y2="490" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/><text x="510" y="130" class="note" fill="#64748b">螺旋轴</text>
  <g fill="none" stroke-linecap="round"><path d="M325 145 C325 105 665 105 665 145 C665 185 325 185 325 225 C325 265 665 265 665 305 C665 345 325 345 325 385 C325 425 665 425 665 465" stroke="#c4b5fd" stroke-width="18" opacity="0.65"/><path d="M665 145 C665 185 325 185 325 225 M665 305 C665 345 325 345 325 385" stroke="#7c3aed" stroke-width="19"/></g>
  <g fill="#f59e0b" stroke="#ffffff" stroke-width="3"><circle cx="325" cy="145" r="13"/><circle cx="457" cy="175" r="13"/><circle cx="610" cy="197" r="13"/><circle cx="625" cy="238" r="13"/><circle cx="475" cy="270" r="13"/><circle cx="335" cy="305" r="13"/><circle cx="395" cy="345" r="13"/><circle cx="560" cy="370" r="13"/><circle cx="660" cy="410" r="13"/><circle cx="535" cy="445" r="13"/></g>
  <g stroke="#2563eb" stroke-width="3" fill="none"><line x1="720" y1="145" x2="720" y2="305"/><line x1="704" y1="145" x2="736" y2="145"/><line x1="704" y1="305" x2="736" y2="305"/></g><text x="742" y="216" class="label" fill="#1d4ed8">0.54 nm</text><text x="742" y="241" class="note">螺距（一整圈）</text>
  <g stroke="#16a06a" stroke-width="3" fill="none"><line x1="255" y1="145" x2="255" y2="189"/><line x1="242" y1="145" x2="268" y2="145"/><line x1="242" y1="189" x2="268" y2="189"/></g><text x="75" y="164" class="label" fill="#16744a">0.15 nm</text><text x="75" y="188" class="note">每残基沿轴上升</text>
  <rect x="85" y="260" width="180" height="90" rx="15" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="175" y="295" class="label" text-anchor="middle" fill="#c2410c">3.6 残基 / 圈</text><text x="175" y="326" class="note" text-anchor="middle">每残基旋转 100°</text>
  <path d="M385 487 C438 525 555 525 610 487" fill="none" stroke="#ea580c" stroke-width="5" marker-end="url(#arrowOrange)"/><text x="495" y="532" class="label" text-anchor="middle" fill="#c2410c">天然蛋白质中以右手 alpha 螺旋为主</text>
  <line x1="820" y1="115" x2="820" y2="500" stroke="#d8e0eb" stroke-width="2"/>
  <text x="995" y="135" class="label" text-anchor="middle">俯视：侧链向外伸展</text><circle cx="995" cy="305" r="135" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="4"/><circle cx="995" cy="305" r="38" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <g stroke="#ea580c" stroke-width="5" stroke-linecap="round"><line x1="995" y1="267" x2="995" y2="190"/><line x1="1031" y1="293" x2="1100" y2="268"/><line x1="1017" y1="336" x2="1065" y2="404"/><line x1="970" y1="334" x2="915" y2="395"/><line x1="958" y1="294" x2="885" y2="270"/></g><g fill="#f59e0b"><circle cx="995" cy="190" r="13"/><circle cx="1100" cy="268" r="13"/><circle cx="1065" cy="404" r="13"/><circle cx="915" cy="395" r="13"/><circle cx="885" cy="270" r="13"/></g>
  <line x1="860" y1="468" x2="1130" y2="468" stroke="#2563eb" stroke-width="3"/><line x1="860" y1="455" x2="860" y2="481" stroke="#2563eb" stroke-width="3"/><line x1="1130" y1="455" x2="1130" y2="481" stroke="#2563eb" stroke-width="3"/><text x="995" y="505" class="label" text-anchor="middle" fill="#1d4ed8">直径约 0.5 nm（不含侧链）</text>
</svg>
