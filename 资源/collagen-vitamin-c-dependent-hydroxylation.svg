<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">胶原蛋白中脏氨酸和赖氨酸的维生素 C 依赖性羟化</title><desc id="description">显示脏氨酸和赖氨酸在羟化酶、二价铁、氧气、alpha 酮戊二酸和维生素 C 参与下生成羟脏氨酸和羟赖氨酸，并对比缺乏维生素 C 时胶原稳定性下降导致坏血病。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">维生素 C 维持羟化酶的 Fe2+ 活性状态，使新生胶原获得 Hyp / Hyl</text>
  <rect x="65" y="110" width="220" height="230" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2.5"/><text x="175" y="150" class="label" text-anchor="middle">Pro / Lys</text><polygon points="125,205 160,175 200,190 205,235 165,255 125,235" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><text x="175" y="295" class="note" text-anchor="middle">新合成的胶原 alpha 链</text>
  <line x1="295" y1="225" x2="455" y2="225" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="320" y="112" width="310" height="100" rx="15" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="475" y="142" class="label" text-anchor="middle" fill="#1d4ed8">羟化酶复合体</text><text x="475" y="172" class="note" text-anchor="middle">Fe2+ · O2 · alpha-酮戊二酸</text><text x="475" y="198" class="note" text-anchor="middle">维生素 C 帮助维持 Fe2+</text>
  <rect x="455" y="245" width="175" height="85" rx="15" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="542" y="278" class="label" text-anchor="middle" fill="#16744a">+ OH</text><text x="542" y="307" class="note" text-anchor="middle">翻译后修饰</text>
  <rect x="680" y="110" width="220" height="230" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/><text x="790" y="150" class="label" text-anchor="middle" fill="#16744a">Hyp / Hyl</text><polygon points="740,205 775,175 815,190 820,235 780,255 740,235" fill="#bbf7d0" stroke="#16a06a" stroke-width="3"/><circle cx="825" cy="175" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="825" y="182" class="note" text-anchor="middle">OH</text><text x="790" y="295" class="note" text-anchor="middle">三股螺旋稳定、成熟</text><line x1="640" y1="225" x2="670" y2="225" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="940" y="110" width="195" height="230" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2.5"/><text x="1037" y="150" class="label" text-anchor="middle" fill="#b91c1c">缺维生素 C</text><g stroke="#dc2626" stroke-width="5"><line x1="995" y1="190" x2="1080" y2="275"/><line x1="1080" y1="190" x2="995" y2="275"/></g><text x="1037" y="315" class="note" text-anchor="middle">羟化不足</text>
  <path d="M1037 350 L1037 395" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow)"/><text x="1037" y="430" class="label" text-anchor="middle" fill="#b91c1c">新胶原脆弱 → 坏血病</text><text x="465" y="415" class="note" text-anchor="middle" fill="#53657a">血管壁和牙龈等结缔组织更新快，因而首先出现出血与脆性增加</text>
</svg>
