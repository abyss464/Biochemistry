<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">不同残基对 alpha 螺旋稳定性的局部影响</title><desc id="description">比较丙氨酸的小侧链、连续侧链的立体拥挤、脏氨酸造成的刚性折角与氢键缺失，以及甘氨酸过高的构象熅。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 16px; }.panel { stroke-width: 2.5; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">序列对 alpha 螺旋的影响：“容易就位”与“引入冲突/柔性”的平衡</text>
  <g><rect x="60" y="110" width="255" height="310" rx="18" fill="#ecfdf5" stroke="#6ee7b7" class="panel"/><text x="187" y="145" class="label" text-anchor="middle" fill="#16744a">Ala：倾向最强</text><path d="M130 335 C105 300 255 300 230 260 C205 220 105 235 130 190" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round"/><g fill="#f59e0b"><circle cx="128" cy="325" r="10"/><circle cx="190" cy="305" r="10"/><circle cx="229" cy="266" r="10"/><circle cx="178" cy="235" r="10"/><circle cx="130" cy="198" r="10"/></g><text x="187" y="374" class="note" text-anchor="middle">甲基小、不带电</text><text x="187" y="397" class="note" text-anchor="middle">不妨碍主链氢键</text></g>
  <g><rect x="335" y="110" width="255" height="310" rx="18" fill="#fff7ed" stroke="#fdba74" class="panel"/><text x="462" y="145" class="label" text-anchor="middle" fill="#c2410c">连续侧链：拥挤</text><path d="M405 335 C380 300 530 300 505 260 C480 220 380 235 405 190" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round"/><g fill="#fb923c" stroke="#c2410c" stroke-width="2"><circle cx="403" cy="320" r="24"/><circle cx="458" cy="300" r="25"/><circle cx="500" cy="270" r="26"/><circle cx="465" cy="240" r="25"/></g><g stroke="#dc2626" stroke-width="4"><line x1="448" y1="267" x2="472" y2="291"/><line x1="472" y1="267" x2="448" y2="291"/></g><text x="462" y="374" class="note" text-anchor="middle">Asn / Ser / Thr / Cys 连续时</text><text x="462" y="397" class="note" text-anchor="middle">体积和形状使螺旋不稳定</text></g>
  <g><rect x="610" y="110" width="255" height="310" rx="18" fill="#fff1f2" stroke="#fda4af" class="panel"/><text x="737" y="145" class="label" text-anchor="middle" fill="#b91c1c">Pro：刚性折角</text><path d="M675 335 C650 300 790 300 770 270 L700 235 L725 190" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round"/><polygon points="704,235 726,210 755,225 750,258 718,265" fill="#fecdd3" stroke="#e11d48" stroke-width="3"/><text x="737" y="338" class="note" text-anchor="middle" fill="#b91c1c">φ 旋转受环限制</text><text x="737" y="374" class="note" text-anchor="middle">肽键 N 没有 H</text><text x="737" y="397" class="note" text-anchor="middle">无法提供螺旋氢键</text></g>
  <g><rect x="885" y="110" width="255" height="310" rx="18" fill="#f5f3ff" stroke="#c4b5fd" class="panel"/><text x="1012" y="145" class="label" text-anchor="middle" fill="#6d28d9">Gly：过于柔软</text><path d="M935 330 C970 285 910 255 990 225 C1060 198 1100 250 1060 310" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 9"/><g fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"><circle cx="949" cy="312" r="15"/><circle cx="942" cy="255" r="15"/><circle cx="1002" cy="220" r="15"/><circle cx="1065" cy="252" r="15"/><circle cx="1062" cy="309" r="15"/></g><text x="1012" y="374" class="note" text-anchor="middle">侧链只是 H，可取构象太多</text><text x="1012" y="397" class="note" text-anchor="middle">固定成螺旋的熅代价高</text></g>
</svg>
