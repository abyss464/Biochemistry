<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">肽键刚性平面、二面角与拉氏图</title>
  <desc id="description">三联教学图：肽平面与 phi、psi、omega 旋转轴，omega 的反式与顺式构象，以及带有 alpha 和 beta 典型落点的 Ramachandran 图。</desc>
  <defs>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }
      .panel-title { font-size: 25px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 650; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
      .bond { stroke: #263449; stroke-width: 5; stroke-linecap: round; }
      .peptide-bond { stroke: #dc2626; stroke-width: 8; stroke-linecap: round; }
      .atom { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .atom-text { font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .grid { stroke: #cbd5e1; stroke-width: 1.3; }
      .axis { stroke: #475569; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fc"/>
  <text x="50" y="55" font-size="35" font-weight="800">肽键刚性平面、二面角与拉氏图</text>
  <text x="50" y="91" font-size="20" fill="#526176">肽键锁定 ω；主链主要靠 φ 和 ψ 改变方向，但可取组合受立体位阻限制。</text>

  <rect x="40" y="125" width="820" height="350" rx="20" fill="#ffffff" filter="url(#panelShadow)"/>
  <text x="70" y="170" class="panel-title">1  相邻肽平面：Cα 是“铰链”</text>

  <polygon points="82,286 205,198 390,210 500,286 420,420 178,414" fill="#dbeafe" stroke="#7aa7df" stroke-width="2" opacity="0.78"/>
  <polygon points="423,210 612,196 838,287 744,421 518,411 456,322" fill="#dcfce7" stroke="#70b98b" stroke-width="2" opacity="0.78"/>
  <text x="145" y="226" class="small" fill="#295f9e">肽平面 i−1</text>
  <text x="710" y="226" class="small" fill="#2d7850">肽平面 i</text>

  <line x1="112" y1="328" x2="230" y2="270" class="bond"/>
  <line x1="230" y1="270" x2="350" y2="328" class="peptide-bond"/>
  <line x1="350" y1="328" x2="470" y2="270" class="bond"/>
  <line x1="470" y1="270" x2="590" y2="328" class="bond"/>
  <line x1="590" y1="328" x2="710" y2="270" class="peptide-bond"/>
  <line x1="710" y1="270" x2="818" y2="328" class="bond"/>

  <line x1="222" y1="257" x2="246" y2="199" class="bond"/>
  <line x1="234" y1="262" x2="258" y2="204" class="bond"/>
  <line x1="350" y1="344" x2="350" y2="397" class="bond"/>
  <line x1="582" y1="341" x2="606" y2="399" class="bond"/>
  <line x1="594" y1="336" x2="618" y2="394" class="bond"/>
  <line x1="710" y1="254" x2="710" y2="205" class="bond"/>

  <g>
    <circle cx="112" cy="328" r="25" class="atom"/><text x="112" y="328" class="atom-text">Cα</text>
    <circle cx="230" cy="270" r="24" class="atom"/><text x="230" y="270" class="atom-text">C</text>
    <circle cx="350" cy="328" r="24" class="atom"/><text x="350" y="328" class="atom-text">N</text>
    <circle cx="470" cy="270" r="27" class="atom"/><text x="470" y="270" class="atom-text">Cα</text>
    <circle cx="590" cy="328" r="24" class="atom"/><text x="590" y="328" class="atom-text">C</text>
    <circle cx="710" cy="270" r="24" class="atom"/><text x="710" y="270" class="atom-text">N</text>
    <circle cx="818" cy="328" r="25" class="atom"/><text x="818" y="328" class="atom-text">Cα</text>
    <circle cx="252" cy="191" r="20" class="atom"/><text x="252" y="191" class="atom-text">O</text>
    <circle cx="350" cy="410" r="20" class="atom"/><text x="350" y="410" class="atom-text">H</text>
    <circle cx="614" cy="408" r="20" class="atom"/><text x="614" y="408" class="atom-text">O</text>
    <circle cx="710" cy="193" r="20" class="atom"/><text x="710" y="193" class="atom-text">H</text>
  </g>

  <path d="M 365 263 C 385 224, 432 219, 457 246" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="395" y="218" class="label" fill="#7c3aed">φ</text>
  <text x="318" y="247" class="tiny" fill="#6d28d9">N—Cα</text>
  <path d="M 487 331 C 515 370, 558 371, 581 344" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="530" y="393" class="label" fill="#ea580c">ψ</text>
  <text x="508" y="349" class="tiny" fill="#c2410c">Cα—C</text>
  <path d="M 639 255 A 35 35 0 0 1 675 315" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="6 5"/>
  <text x="640" y="236" class="label" fill="#dc2626">ω</text>
  <g transform="translate(650 303)" stroke="#dc2626" fill="#fff7f7" stroke-width="3">
    <rect x="0" y="10" width="30" height="25" rx="4"/>
    <path d="M 7 10 V 5 A 8 8 0 0 1 23 5 V 10" fill="none"/>
  </g>
  <text x="70" y="451" class="small" fill="#4b5c72"><tspan font-weight="700" fill="#7c3aed">φ</tspan> 和 <tspan font-weight="700" fill="#ea580c">ψ</tspan> 可转动 → 两个刚性肽平面相对转折；<tspan font-weight="700" fill="#dc2626">ω</tspan> 所在的 C—N 肽键几乎不转动。</text>

  <rect x="40" y="495" width="820" height="355" rx="20" fill="#ffffff" filter="url(#panelShadow)"/>
  <text x="70" y="540" class="panel-title">2  ω 控制肽键的反式 / 顺式</text>
  <line x1="450" y1="565" x2="450" y2="815" stroke="#d9e0ea" stroke-width="2"/>

  <text x="245" y="580" class="label" text-anchor="middle" fill="#16744a">ω ≈ ±180°　反式 trans</text>
  <line x1="190" y1="680" x2="330" y2="680" class="peptide-bond"/>
  <line x1="190" y1="680" x2="110" y2="755" class="bond"/>
  <line x1="330" y1="680" x2="410" y2="605" class="bond"/>
  <line x1="182" y1="670" x2="196" y2="638" class="bond"/>
  <line x1="194" y1="673" x2="208" y2="641" class="bond"/>
  <line x1="330" y1="680" x2="340" y2="751" class="bond"/>
  <circle cx="190" cy="680" r="25" class="atom"/><text x="190" y="680" class="atom-text">C</text>
  <circle cx="330" cy="680" r="25" class="atom"/><text x="330" y="680" class="atom-text">N</text>
  <circle cx="202" cy="620" r="21" class="atom"/><text x="202" y="620" class="atom-text">O</text>
  <circle cx="344" cy="768" r="21" class="atom"/><text x="344" y="768" class="atom-text">H</text>
  <circle cx="100" cy="767" r="28" class="atom"/><text x="100" y="767" class="atom-text">Cαᵢ</text>
  <circle cx="420" cy="593" r="31" class="atom"/><text x="420" y="593" class="atom-text">Cαᵢ₊₁</text>
  <path d="M 135 785 Q 260 825 385 785" fill="none" stroke="#16a06a" stroke-width="3"/>
  <text x="260" y="824" class="small" text-anchor="middle" fill="#16744a">两个 Cα 分居肽键两侧：占绝对多数</text>

  <text x="655" y="580" class="label" text-anchor="middle" fill="#b45309">ω ≈ 0°　顺式 cis</text>
  <line x1="570" y1="680" x2="710" y2="680" class="peptide-bond"/>
  <line x1="570" y1="680" x2="495" y2="755" class="bond"/>
  <line x1="710" y1="680" x2="785" y2="755" class="bond"/>
  <line x1="562" y1="670" x2="576" y2="638" class="bond"/>
  <line x1="574" y1="673" x2="588" y2="641" class="bond"/>
  <line x1="710" y1="680" x2="722" y2="641" class="bond"/>
  <circle cx="570" cy="680" r="25" class="atom"/><text x="570" y="680" class="atom-text">C</text>
  <circle cx="710" cy="680" r="25" class="atom"/><text x="710" y="680" class="atom-text">N</text>
  <circle cx="582" cy="620" r="21" class="atom"/><text x="582" y="620" class="atom-text">O</text>
  <circle cx="726" cy="620" r="21" class="atom"/><text x="726" y="620" class="atom-text">H</text>
  <circle cx="485" cy="767" r="28" class="atom"/><text x="485" y="767" class="atom-text">Cαᵢ</text>
  <circle cx="795" cy="767" r="31" class="atom"/><text x="795" y="767" class="atom-text">Cαᵢ₊₁</text>
  <path d="M 520 785 Q 640 735 760 785" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="640" y="824" class="small" text-anchor="middle" fill="#a54b08">两个 Cα 位于同侧：少见，X–Pro 中较多</text>

  <rect x="900" y="125" width="660" height="725" rx="20" fill="#ffffff" filter="url(#panelShadow)"/>
  <text x="930" y="170" class="panel-title">3  φ–ψ 拉氏图（Ramachandran plot）</text>
  <rect x="946" y="190" width="22" height="14" rx="3" fill="#d9f2e4" stroke="#6ab58b"/>
  <text x="976" y="203" class="tiny">允许区</text>
  <rect x="1050" y="190" width="22" height="14" rx="3" fill="#61bf8c"/>
  <text x="1080" y="203" class="tiny">优选区</text>
  <text x="1180" y="203" class="tiny" fill="#607086">空白 = 非键合原子立体冲突</text>

  <rect x="980" y="230" width="480" height="480" fill="#fbfcfe" stroke="#64748b" stroke-width="2"/>
  <g>
    <line x1="980" y1="230" x2="980" y2="710" class="grid"/>
    <line x1="1100" y1="230" x2="1100" y2="710" class="grid"/>
    <line x1="1220" y1="230" x2="1220" y2="710" class="grid"/>
    <line x1="1340" y1="230" x2="1340" y2="710" class="grid"/>
    <line x1="1460" y1="230" x2="1460" y2="710" class="grid"/>
    <line x1="980" y1="230" x2="1460" y2="230" class="grid"/>
    <line x1="980" y1="350" x2="1460" y2="350" class="grid"/>
    <line x1="980" y1="470" x2="1460" y2="470" class="grid"/>
    <line x1="980" y1="590" x2="1460" y2="590" class="grid"/>
    <line x1="980" y1="710" x2="1460" y2="710" class="grid"/>
    <line x1="1220" y1="230" x2="1220" y2="710" class="axis"/>
    <line x1="980" y1="470" x2="1460" y2="470" class="axis"/>
  </g>

  <path d="M 982 232 L 1160 232 C 1178 270, 1158 317, 1140 357 C 1122 399, 1128 435, 1090 448 C 1044 464, 1003 425, 982 389 Z" fill="#d9f2e4" stroke="#69b58a" stroke-width="2"/>
  <path d="M 1005 430 C 1042 397, 1129 397, 1177 428 C 1200 467, 1181 544, 1147 604 C 1117 635, 1060 620, 1033 574 C 1005 526, 987 465, 1005 430 Z" fill="#d9f2e4" stroke="#69b58a" stroke-width="2"/>
  <path d="M 1263 392 C 1295 351, 1366 351, 1400 394 C 1424 431, 1407 483, 1362 507 C 1316 525, 1264 485, 1258 441 C 1257 424, 1258 407, 1263 392 Z" fill="#d9f2e4" stroke="#69b58a" stroke-width="2"/>

  <path d="M 990 240 L 1138 240 C 1152 274, 1132 319, 1116 350 C 1093 389, 1040 405, 1002 374 L 990 334 Z" fill="#61bf8c" opacity="0.95"/>
  <path d="M 1054 456 C 1082 428, 1141 430, 1165 465 C 1181 503, 1153 570, 1123 591 C 1087 602, 1054 568, 1048 529 C 1042 496, 1043 475, 1054 456 Z" fill="#61bf8c" opacity="0.95"/>
  <ellipse cx="1296" cy="407" rx="34" ry="43" fill="#61bf8c" opacity="0.95"/>

  <g class="tiny" fill="#53657a">
    <text x="980" y="735" text-anchor="middle">−180</text>
    <text x="1100" y="735" text-anchor="middle">−90</text>
    <text x="1220" y="735" text-anchor="middle">0</text>
    <text x="1340" y="735" text-anchor="middle">+90</text>
    <text x="1460" y="735" text-anchor="middle">+180</text>
    <text x="968" y="236" text-anchor="end">+180</text>
    <text x="968" y="356" text-anchor="end">+90</text>
    <text x="968" y="476" text-anchor="end">0</text>
    <text x="968" y="596" text-anchor="end">−90</text>
    <text x="968" y="716" text-anchor="end">−180</text>
  </g>
  <text x="1220" y="768" class="label" text-anchor="middle">φ (degrees)</text>
  <text x="925" y="470" class="label" text-anchor="middle" transform="rotate(-90 925 470)">ψ (degrees)</text>

  <circle cx="1040" cy="290" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
  <text x="1053" y="283" class="small" fill="#1d4ed8">β 折叠</text>
  <text x="1053" y="304" class="tiny" fill="#365b91">−135°, +135°</text>
  <circle cx="1144" cy="533" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
  <text x="1160" y="546" class="small" fill="#6d28d9">右手 α</text>
  <text x="1160" y="567" class="tiny" fill="#68489a">−57°, −47°</text>
  <circle cx="1296" cy="407" r="7" fill="#ea580c" stroke="#ffffff" stroke-width="3"/>
  <text x="1310" y="397" class="small" fill="#c2410c">左手 α</text>

  <line x1="1212" y1="462" x2="1228" y2="478" stroke="#dc2626" stroke-width="4"/>
  <line x1="1228" y1="462" x2="1212" y2="478" stroke="#dc2626" stroke-width="4"/>
  <text x="1238" y="487" class="tiny" fill="#b91c1c">φ=ψ=0°：位阻冲突</text>

  <text x="930" y="803" class="small" fill="#4b5c72">每个残基是一个 (φ, ψ) 点；区域边界为示意。</text>
  <text x="930" y="829" class="small" fill="#4b5c72">甘氨酸位阻小，允许区更广；脯氨酸受环结构限制，允许区更窄。</text>
</svg>
