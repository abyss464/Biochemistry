<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Omega 环和无规卷曲的结构与功能</title><desc id="description">左侧示意六至八个残基的 Omega 环改变肽链走向并使首尾距离小于一纳米；右侧显示无规卷曲具有可重现的平均结构和局部柔性，并参与配体结合。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">环与“无规”区都不是乱线：它们用可控柔性完成功能</text><line x1="600" y1="105" x2="600" y2="430" stroke="#d8e0eb" stroke-width="2"/>
  <text x="315" y="125" class="label" text-anchor="middle" fill="#1d4ed8">Omega 环：短链远行，首尾靠近</text><path d="M100 310 L210 310 C230 120 485 120 515 310 L570 310" fill="none" stroke="#2563eb" stroke-width="15" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="3"><circle cx="210" cy="310" r="22"/><circle cx="245" cy="215" r="22"/><circle cx="315" cy="170" r="22"/><circle cx="390" cy="178" r="22"/><circle cx="460" cy="225" r="22"/><circle cx="515" cy="310" r="22"/></g><text x="315" y="160" class="note" text-anchor="middle">6–8 残基最常见（总长≤16）</text><line x1="230" y1="345" x2="495" y2="345" stroke="#16a06a" stroke-width="4"/><line x1="230" y1="333" x2="230" y2="357" stroke="#16a06a" stroke-width="4"/><line x1="495" y1="333" x2="495" y2="357" stroke="#16a06a" stroke-width="4"/><text x="362" y="380" class="label" text-anchor="middle" fill="#16744a">首尾距离 &lt; 1 nm</text><text x="315" y="420" class="note" text-anchor="middle">结果：肽链方向被快速改变</text>
  <text x="900" y="125" class="label" text-anchor="middle" fill="#6d28d9">无规卷曲：稳定平均结构 + 局部柔性</text><path d="M665 300 C710 150 760 360 830 210 C895 80 940 360 1005 230 C1050 140 1095 220 1135 180" fill="none" stroke="#8b5cf6" stroke-width="13" stroke-linecap="round"/><path d="M665 315 C720 165 770 375 840 225 C905 95 950 375 1015 245 C1060 155 1105 235 1140 195" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-dasharray="9 7"/>
  <path d="M845 250 Q905 310 965 250" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><circle cx="905" cy="278" r="25" fill="#f59e0b" stroke="#b45309" stroke-width="3"/><text x="905" y="285" class="note" text-anchor="middle" fill="#ffffff">配体</text><text x="900" y="360" class="note" text-anchor="middle">柔性环可包围底物、金属或辅基</text><text x="900" y="390" class="label" text-anchor="middle" fill="#6d28d9">常构成活性部位与专一结合位点</text><text x="900" y="420" class="note" text-anchor="middle">虚线表示可取的相近构象，而非无限随机</text>
</svg>
