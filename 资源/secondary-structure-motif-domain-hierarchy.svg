<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">从二级结构到超二级结构再到结构域</title><desc id="description">独立的 alpha 螺旋和 beta 股通过连接环组合成有规则的超二级结构模体，多个模体再装配成紧密、可相对独立折叠的结构域。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="beta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 17px; }</style></defs>
  <rect width="1200" height="410" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="354" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">超二级结构是“局部组合语法”，位于单个二级结构与整个结构域之间</text>
  <rect x="70" y="115" width="280" height="210" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/><text x="210" y="150" class="label" text-anchor="middle">二级结构单元</text><path d="M115 245 C95 210 205 210 185 180 C165 150 95 170 115 135" transform="translate(20 55)" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/><line x1="220" y1="245" x2="305" y2="245" stroke="#2563eb" stroke-width="14" marker-end="url(#beta)"/><text x="210" y="300" class="note" text-anchor="middle">alpha 螺旋、beta 股、转角/环</text>
  <line x1="365" y1="220" x2="455" y2="220" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="410" y="195" class="note" text-anchor="middle">相邻组合</text>
  <rect x="470" y="115" width="280" height="210" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2.5"/><text x="610" y="150" class="label" text-anchor="middle">motif / 超二级结构</text><line x1="520" y1="250" x2="585" y2="250" stroke="#2563eb" stroke-width="13" marker-end="url(#beta)"/><path d="M595 275 C575 245 660 245 640 215 C620 185 575 205 595 175" fill="none" stroke="#7c3aed" stroke-width="11" stroke-linecap="round"/><line x1="655" y1="250" x2="720" y2="250" stroke="#2563eb" stroke-width="13" marker-end="url(#beta)"/><text x="610" y="300" class="note" text-anchor="middle">有可重复识别的局部拓扑</text>
  <line x1="765" y1="220" x2="855" y2="220" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="810" y="195" class="note" text-anchor="middle">装配折叠</text>
  <rect x="870" y="115" width="260" height="210" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2.5"/><text x="1000" y="150" class="label" text-anchor="middle">结构域 domain</text><path d="M945 180 C1010 140 1090 190 1080 250 C1070 315 960 315 920 260 C890 220 905 195 945 180 Z" fill="#d1fae5" stroke="#16a06a" stroke-width="3"/><path d="M940 250 C920 220 990 220 970 190" fill="none" stroke="#7c3aed" stroke-width="10"/><line x1="1000" y1="245" x2="1060" y2="245" stroke="#2563eb" stroke-width="12" marker-end="url(#beta)"/><text x="1000" y="300" class="note" text-anchor="middle">紧密、相对独立的折叠实体</text>
  <text x="600" y="355" class="note" text-anchor="middle" fill="#53657a">规模不是硬分界：小 motif 只占一段序列，大 motif 可接近整个折叠核心</text>
</svg>
