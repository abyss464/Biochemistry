<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">核磁共振测定溶液中蛋白质结构的流程</title><desc id="description">蛋白质溶液放入强磁场，具核自旋的原子核吸收射频能量发生共振，通过谱峰与核间约束计算动态构象集合。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 20px; font-weight: 700; }.note { font-size: 17px; }.box { fill: #fbf9ff; stroke: #a78bfa; stroke-width: 2.5; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="74" class="heading">NMR：在溶液中用核间距离与角度约束重建动态结构</text>
  <rect x="60" y="110" width="230" height="260" rx="18" class="box"/><text x="175" y="145" class="label" text-anchor="middle">① 高浓度蛋白溶液</text><path d="M125 175 L225 175 L211 326 Q175 350 139 326 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M140 260 Q175 245 210 260 L211 326 Q175 350 139 326 Z" fill="#93c5fd"/><path d="M155 290 C172 260 186 312 202 280" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="175" y="352" class="note" text-anchor="middle">蛋白质保持水合与运动</text>
  <rect x="350" y="110" width="230" height="260" rx="18" class="box"/><text x="465" y="145" class="label" text-anchor="middle">② 强磁场 + 射频脉冲</text><path d="M385 185 Q465 130 545 185" fill="none" stroke="#dc2626" stroke-width="5"/><path d="M385 305 Q465 360 545 305" fill="none" stroke="#2563eb" stroke-width="5"/><text x="400" y="205" class="label" fill="#b91c1c">N</text><text x="520" y="303" class="label" fill="#1d4ed8">S</text><g stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"><line x1="430" y1="285" x2="430" y2="213"/><line x1="465" y1="285" x2="465" y2="213"/><line x1="500" y1="285" x2="500" y2="213"/></g><path d="M390 250 C410 225 430 275 450 250 C470 225 490 275 515 245" fill="none" stroke="#f59e0b" stroke-width="4"/><text x="465" y="352" class="note" text-anchor="middle">核自旋发生能级跃迁与共振</text>
  <rect x="640" y="110" width="230" height="260" rx="18" class="box"/><text x="755" y="145" class="label" text-anchor="middle">③ 多维 NMR 谱</text><line x1="680" y1="315" x2="835" y2="315" stroke="#475569" stroke-width="3"/><path d="M690 315 L705 315 L710 280 L715 315 L742 315 L750 205 L758 315 L785 315 L792 250 L799 315 L825 315" fill="none" stroke="#7c3aed" stroke-width="4"/><g fill="#dc2626"><circle cx="710" cy="280" r="5"/><circle cx="750" cy="205" r="5"/><circle cx="792" cy="250" r="5"/></g><text x="755" y="342" class="note" text-anchor="middle">化学位移、NOE、J 耦合等约束</text>
  <rect x="930" y="110" width="210" height="260" rx="18" class="box"/><text x="1035" y="145" class="label" text-anchor="middle">④ 构象集合</text><g fill="none" stroke-width="5" stroke-linecap="round" opacity="0.75"><path d="M970 270 C995 190 1030 320 1095 220" stroke="#2563eb"/><path d="M968 250 C1010 180 1045 310 1098 235" stroke="#7c3aed"/><path d="M975 285 C1005 205 1050 325 1090 205" stroke="#16a06a"/></g><text x="1035" y="328" class="note" text-anchor="middle">多个同样满足约束的模型</text><text x="1035" y="352" class="note" text-anchor="middle">可反映柔性与构象变化</text>
  <g stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"><line x1="298" y1="240" x2="337" y2="240"/><line x1="588" y1="240" x2="627" y2="240"/><line x1="878" y1="240" x2="917" y2="240"/></g>
  <rect x="115" y="402" width="970" height="42" rx="12" fill="#f3e8ff"/><text x="600" y="430" class="note" text-anchor="middle"><tspan font-weight="700" fill="#6d28d9">可观测：1H、13C、15N、19F、31P</tspan><tspan dx="32">　不可观测：12C、16O、32S（核自旋为 0）</tspan></text>
</svg>
