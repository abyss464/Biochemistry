<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">疏水效应的水分子熵驱动机制</title><desc id="description">对比疏水侧链分散时大量有序水笼与疏水侧链聚集后水分子释放、熵增加的过程。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16a06a"/></marker><style>text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans", sans-serif; fill: #172033; }.heading { font-size: 28px; font-weight: 750; }.label { font-size: 21px; font-weight: 700; }.note { font-size: 18px; }.water { fill: #bfdbfe; stroke: #3b82f6; stroke-width: 2; }.hydrophobe { fill: #b96b2d; stroke: #7c3f12; stroke-width: 3; }</style></defs>
  <rect width="1200" height="500" fill="#f6f8fc"/><rect x="30" y="28" width="1140" height="444" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="60" y="75" class="heading">疏水作用的关键：释放有序水，而非疏水基团之间出现特殊键</text>
  <rect x="65" y="105" width="445" height="310" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="287" y="140" class="label" text-anchor="middle" fill="#1d4ed8">疏水侧链分散</text>
  <g class="hydrophobe"><circle cx="190" cy="250" r="42"/><circle cx="385" cy="270" r="42"/></g><g class="water"><circle cx="125" cy="205" r="15"/><circle cx="150" cy="175" r="15"/><circle cx="198" cy="170" r="15"/><circle cx="242" cy="195" r="15"/><circle cx="257" cy="244" r="15"/><circle cx="238" cy="300" r="15"/><circle cx="188" cy="326" r="15"/><circle cx="140" cy="303" r="15"/><circle cx="320" cy="220" r="15"/><circle cx="345" cy="185" r="15"/><circle cx="395" cy="184" r="15"/><circle cx="438" cy="211" r="15"/><circle cx="451" cy="260" r="15"/><circle cx="430" cy="318" r="15"/><circle cx="378" cy="338" r="15"/><circle cx="334" cy="309" r="15"/></g>
  <text x="287" y="381" class="note" text-anchor="middle">每个非极性表面都组织一层水笼</text><text x="287" y="405" class="label" text-anchor="middle" fill="#b91c1c">水的熵降低（不利）</text>
  <path d="M530 260 L650 260" stroke="#16a06a" stroke-width="8" marker-end="url(#arrow)"/><text x="590" y="235" class="label" text-anchor="middle" fill="#16744a">聚集 / 折叠</text>
  <rect x="680" y="105" width="455" height="310" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="907" y="140" class="label" text-anchor="middle" fill="#16744a">疏水侧链聚成内核</text>
  <g class="hydrophobe"><circle cx="852" cy="253" r="42"/><circle cx="920" cy="253" r="42"/><circle cx="886" cy="310" r="42"/></g><g class="water"><circle cx="750" cy="190" r="15"/><circle cx="810" cy="170" r="15"/><circle cx="997" cy="178" r="15"/><circle cx="1055" cy="210" r="15"/><circle cx="1030" cy="315" r="15"/><circle cx="760" cy="330" r="15"/><circle cx="1080" cy="355" r="15"/><circle cx="720" cy="265" r="15"/></g><g stroke="#3b82f6" stroke-width="2.5"><path d="M750 173 l-10 -16"/><path d="M810 153 l8 -18"/><path d="M997 161 l15 -15"/><path d="M1055 193 l12 -18"/><path d="M1030 298 l18 8"/><path d="M760 313 l-16 10"/></g>
  <text x="907" y="381" class="note" text-anchor="middle">需要有序排列的水分子减少</text><text x="907" y="405" class="label" text-anchor="middle" fill="#16744a">水的熵增加（有利）</text><text x="600" y="452" class="label" text-anchor="middle" fill="#16744a">ΔS(water) &gt; 0 → 疏水埋藏推动蛋白质折叠</text>
</svg>
